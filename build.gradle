plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

loom {
    accessWidenerPath = file("src/main/resources/pianocraft.accesswidener")
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.21.11:2025.12.20@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    modLocalRuntime "com.terraformersmc:modmenu:${project.mod_menu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

publishMods {
    file = remapJar.archiveFile
    type = STABLE
    displayName = "PianoCraft $mod_version - $minecraft_version"
    changelog = getChangelogForVersion(mod_version)

    modLoaders.add("fabric")

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "FunskyDev/PianoCraft"
        commitish = calculateGitHash()
        tagName = providers.environmentVariable("VERSION_TAG")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_API_KEY")
        projectId = "qgvzPai8"
        minecraftVersions.add("$minecraft_version")
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "859363"
        minecraftVersions.add("$minecraft_version")
        clientRequired = true
        serverRequired = true
    }
}

String calculateGitHash() {
    try {
        ExecOutput output = providers.exec {
            commandLine("git", "rev-parse", "HEAD")
        }
        return output.standardOutput.asText.get().trim()
    } catch (Throwable ignored) {
        return "unknown"
    }
}

String getChangelogForVersion(String version) {
    File changelogFile = file("CHANGELOG.md")
    if (!changelogFile.exists()) {
        return "No changelog available"
    }

    try {
        String content = changelogFile.text
        String versionHeader = "## [$version]"
        int startIndex = content.indexOf(versionHeader)

        if (startIndex == -1) {
            return "No changelog found for version $version"
        }

        // Find the start of the content (skip the version header line)
        startIndex = content.indexOf("\n", startIndex) + 1

        // Find the next version header or end of file
        int endIndex = content.indexOf("\n## [", startIndex)
        if (endIndex == -1) {
            endIndex = content.length()
        }

        // Extract and trim the changelog content
        String changelog = content.substring(startIndex, endIndex).trim()

        return changelog.isEmpty() ? "No changelog content for version $version" : changelog
    } catch (Exception e) {
        return "Error reading changelog: ${e.message}"
    }
}
